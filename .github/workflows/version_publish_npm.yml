name: Version and Publish NPM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  version-and-publish:
    name: Version and Publish
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "18"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
          cache-dependency-path: ./typescript

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./typescript

      - name: Version and/or Publish to NPM
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
        with:
          commit: "chore: version typescript packages"
          title: "chore: version typescript packages"
          version: pnpm run changeset:version
          publish: pnpm run publish
          cwd: ./typescript
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
